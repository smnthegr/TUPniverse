<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUP Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-red-50 to-yellow-100 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
            <!-- Login Screen -->
            <div id="loginScreen">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">TUP Student Portal</h1>
                    <p class="text-gray-600">Technological University of the Philippines</p>
                </div>

                <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                    <p class="text-sm text-blue-800 text-center">
                        <svg class="w-5 h-5 inline mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                        </svg>
                        Sign in with your <strong>@tup.edu.ph</strong> email
                    </p>
                </div>

                <button 
                    onclick="signInWithGoogle()"
                    class="w-full bg-white border-2 border-gray-300 text-gray-700 py-3 px-4 rounded-lg hover:bg-gray-50 transition-all font-medium shadow-sm flex items-center justify-center gap-3"
                >
                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                </button>

                <div class="mt-6 text-center text-sm text-gray-500">
                    <p>🔒 Secure login via Google</p>
                </div>
            </div>

            <!-- Success Screen -->
            <div id="successScreen" class="hidden text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome Back!</h2>
                <p class="text-gray-600 mb-4">Successfully logged in as:</p>
                <div class="bg-gray-50 rounded-lg p-4 mb-6">
                    <p id="userName" class="text-lg font-semibold text-gray-800 mb-1"></p>
                    <p id="userEmail" class="text-sm text-gray-600"></p>
                </div>
                <button 
                    onclick="signOut()"
                    class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition-colors font-medium"
                >
                    Sign Out
                </button>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-700 text-center"></p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Replace with YOUR Firebase config
        // Get this from Firebase Console > Project Settings > Your apps
        const firebaseConfig = {
            apiKey: "AIzaSyCBet8G3HOy8_kOSA_KPT9hUZrICsvCpUQ",
            authDomain: "tupniverse-login-2ab22.firebaseapp.com",
            projectId: "tupniverse-login-2ab22",
            storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
            messagingSenderId: "223789253678",
            appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Configure Google Sign-In
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({
            hd: 'tup.edu.ph',  // Only allow TUP emails
            prompt: 'consent'
        });

        // Sign in with Google
        function signInWithGoogle() {
            hideError();
            
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    const email = user.email;
                    
                    // Verify it's a TUP email
                    if (email.endsWith('@tup.edu.ph')) {
                        window.location.href = 'index.html';
                    } else {
                        auth.signOut();
                        showError('Please use your @tup.edu.ph email address');
                    }
                })
                .catch((error) => {
                    console.error('Login error:', error);
                    if (error.code === 'auth/popup-closed-by-user') {
                        showError('Sign-in cancelled. Please try again.');
                    } else {
                        showError('Login failed: ' + error.message);
                    }
                });
        }

        // Sign out
        function signOut() {
            auth.signOut().then(() => {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('successScreen').classList.add('hidden');
                hideError();
            });
        }

        // Show success screen
        function showSuccess(name, email) {
            document.getElementById('userName').textContent = name || 'Student';
            document.getElementById('userEmail').textContent = email;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.querySelector('p').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        // Hide error message
        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user && user.email.endsWith('@tup.edu.ph')) {
                showSuccess(user.displayName, user.email);
            }
        });
    </script>
</body>
</html>
