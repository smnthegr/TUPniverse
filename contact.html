<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <script src="navbar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    .error-message {
      color: red;
      font-size: 0.9em;
      margin-top: 5px;
      display: block; /* Ensures it takes a new line */
    }
  </style>
</head>
<body>
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="bg.mp4" type="video/mp4">
      <source src="bg.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>
</div>
  <div class="contact-container">
    <div class="contact-left">
      <h2><span class="script-font">Contact Us</span><br><span class="thankyou">THANK YOU!</span></h2>
      <p>
        We're here to help you with any questions about our university.<br>
        Whether you're a prospective student, current student, parent, or community member, we'd love to hear from you.
      </p>

      <p class="contact-info">
        Phone: 5301.3040/5301.3041 & (02) 301 3001<br>
        Email: registrar@tup.edu.ph/usg@tup.edu.ph
      </p>

      <form action="https://formspree.io/f/xovpgqpl" method="POST" id="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstName" id="firstName" required minlength="2" maxlength="50">
            <span class="error-message" id="firstName-error"></span>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastName" id="lastName" required minlength="2" maxlength="50">
            <span class="error-message" id="lastName-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label>Email (Required)</label>
          <input type="email" name="email" id="email" required>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label>Message (Required)</label>
          <textarea name="message" id="message" required minlength="10" maxlength="1000"></textarea>
          <span class="error-message" id="message-error"></span>
        </div>

        <button type="submit" class="send-btn">SEND</button>
      </form>
    </div>

    <div class="contact-right">
      <img src="tup.jpg" alt="TUP Logo">
    </div>
  </div>

  <script>
    // --- Helper Functions ---

    // Sanitization Function
    function sanitizeInput(str) {
      if (!str) return '';
      return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function displayError(id, message) {
      const errorElement = document.getElementById(id);
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.color = 'red'; 
      }
    }

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
    }


    // --- Core Validation Function ---
    function validateContactForm() {
      let isValid = true;
      clearErrors(); 

      // 1. Get raw input values
      const rawFirstName = document.getElementById('firstName').value;
      const rawLastName = document.getElementById('lastName').value;
      const rawEmail = document.getElementById('email').value;
      const rawMessage = document.getElementById('message').value;

      // 2. Sanitize and trim all values
      const firstName = sanitizeInput(rawFirstName).trim();
      const lastName = sanitizeInput(rawLastName).trim();
      const email = sanitizeInput(rawEmail).trim(); 
      const message = sanitizeInput(rawMessage).trim();
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      document.getElementById('firstName').value = firstName;
      document.getElementById('lastName').value = lastName;
      document.getElementById('email').value = email;
      document.getElementById('message').value = message;


      if (firstName.length < 2 || firstName.length > 50) { 
          displayError('firstName-error', 'First Name must be between 2 and 50 characters.');
          isValid = false;
      }

      if (lastName.length < 2 || lastName.length > 50) { 
          displayError('lastName-error', 'Last Name must be between 2 and 50 characters.');
          isValid = false;
      }

      if (!emailRegex.test(email)) {
          displayError('email-error', 'Please enter a valid email address.');
          isValid = false;
      }

      if (message.length < 10 || message.length > 500) { 
          displayError('message-error', 'Message must be between 10 and 1000 characters.');
          isValid = false;
      }

      return isValid;
    }
    const form = document.getElementById("contact-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); 

      if (!validateContactForm()) {
        return; // Stop submission if validation fails
      }

      const data = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        alert("✅ Thank you! Your message has been sent successfully.");
        form.reset();
      } else {
        alert("⚠️ Oops! There was a problem sending your message. Please try again.");
      }
    });
  </script>
</body>
</html>
