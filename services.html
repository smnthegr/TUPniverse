    <style>
    .connection-line {
            stroke: #cbd5e1; /* Light gray color */

            stroke-dasharray: 10, 10; /* The dashed pattern */

        }

   <section id="service-assistance" style="min-height: 100vh; padding: 4rem 2rem; position: relative;">
        <div class="service-video-background">
            <video autoplay muted loop playsinline>
                <source src="bg.mp4" type="video/mp4">
                <source src="bg.webm" type="video/webm">
            </video>
        </div>
        
        <div style="max-width: 100%; margin: 0 auto; position: relative; z-index: 1;">
            
            <div id="servicesHeader" class="mb-12">

                    <p class="text-white text-xl mb-2">Everything you need, all in one place</p>
                    <p class="text-white text-base">Browse our services or select from the list to learn more about each process</p>
                    
                    <div class="flex flex-wrap gap-4 mt-6">
                        <button id="initDbBtn" onclick="uploadDefaultData()" style="font-family: 'Outfit', sans-serif;" class="hidden bg-yellow-600 hover:bg-yellow-500 text-white px-5 py-2.5 rounded-lg shadow-lg font-bold flex items-center gap-2 transition-colors font-['Outfit', sans-serif]">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Initialize Database
                        </button>

                        <button id="deleteAllBtn" onclick="deleteAllServices()" style="font-family: 'Outfit', sans-serif;" class="hidden bg-red-900/80 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg shadow-lg font-bold flex items-center gap-2 transition-colors border border-red-500/30 backdrop-blur-sm font-['Outfit', sans-serif]">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="14" y2="15"></line><line x1="14" y1="11" x2="10" y2="15"></line></svg>
                            Reset / Delete All
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex gap-8 items-start -mt-44">
                <div class="flex-1 relative overflow-hidden mt-44">
                    <div id="serviceMenu" class="flex gap-6 service-carousel">
                        <div class="text-white p-8">Loading Services...</div>
                    </div>
                </div>
                
                <div class="w-80 bg-[#290001]/25 backdrop-blur-md rounded-xl border border-white/25 p-6 overflow-y-auto self-start shadow-lg" style="max-height: 600px;">
                    <h3 class="text-[#f5f5dc] text-xl mb-4 font-semibold" style="font-family: 'Outfit', sans-serif;">All Services</h3>
                    <div id="servicesList" class="space-y-2"></div>
                </div>
            </div>

            <div id="detailView" class="hidden fade-in"></div>
        </div>
    </section>

    <button id="adminAddBtn" onclick="openAdminModal()"

               bg-[#3D0001]/60 hover:bg-[#8b0000]/80 
               backdrop-blur-md border border-white/20 hover:border-red-400/50
               text-white shadow-2xl hover:shadow-[0_0_30px_rgba(220,38,38,0.4)] hover:scale-110">
        
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        
        <span class="absolute right-full mr-4 top-1/2 -translate-y-1/2

                     text-white text-sm px-3 py-1.5 rounded-lg whitespace-nowrap 
                     opacity-0 group-hover:opacity-100 transition-opacity font-['Outfit, sans-serif']">
            Add New Service
        </span>
    </button>

            <div class="bg-slate-900 border border-white/20 p-8 rounded-xl w-full max-w-3xl relative shadow-2xl">

                </button>

                <p class="text-gray-400 text-sm mb-6">Fill out the form below. The system will format it automatically.</p>
                
                <form id="serviceBuilderForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    
                    <div class="bg-white/5 p-4 rounded-lg border border-white/10 space-y-4">
                        <h3 class="text-red-400 font-bold uppercase text-xs tracking-wider">Basic Information</h3>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-white/80 text-sm mb-1">Service Title</label>
                                <input type="text" id="buildTitle" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500 focus:border-red-500 outline-none" required>
                            </div>
                            <div>
                                <label class="block text-white/80 text-sm mb-1">Unique ID (lowercase, no spaces)</label>
                                <input type="text" id="buildId" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500 focus:border-red-500 outline-none" required>
                            </div>
                        </div>
        
                        <div>
                            <label class="block text-white/80 text-sm mb-1">Subtitle</label>
                            <input type="text" id="buildDesc" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500 focus:border-red-500 outline-none" required>
                        </div>

                    <div>
                        <label class="block text-white/80 text-sm mb-1">Introduction / Important Note (Optional)</label>
                        <textarea id="buildIntro" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500 focus:border-red-500 outline-none" rows="2" placeholder="e.g. A student may add a subject upon recommendation..."></textarea>
                    </div>
        
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-white/80 text-sm mb-1">View Style</label>
                                <select id="buildType" onchange="updateStepVisibility()" class="w-full bg-slate-800 border border-white/20 rounded p-2 text-white outline-none focus:border-red-500">
                                    <option value="pinboard">Pinboard (Process Steps)</option>
                                    <option value="accordion">Accordion (Dropdown)</option>
                                    <option value="list">Simple List</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-white/80 text-sm mb-1">Fee</label>
                                <input type="text" id="buildFee" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500" placeholder="e.g. ₱100">
                            </div>
                            <div>
                                <label class="block text-white/80 text-sm mb-1">Processing Time</label>
                                <input type="text" id="buildTime" class="w-full bg-black/40 border border-white/20 rounded p-2 text-white placeholder-gray-500" placeholder="e.g. 3-5 Days">
                            </div>
                        </div>

                        <div>
                             <label class="block text-white/80 text-sm mb-1">Select General Icon</label>
                             <div class="flex gap-3 items-center">
                                 <select id="buildIcon" onchange="updateIconPreview()" class="flex-1 bg-slate-800 border border-white/20 rounded p-2 text-white outline-none">
                                    <option value="doc_check">Document with Checkmark</option>
                                    <option value="doc_edit">Document with Pen (Form)</option>
                                    <option value="id_card">ID Card</option>
                                    <option value="money">Money / Payment</option>
                                    <option value="user">User / Student</option>
                                    <option value="grad_cap">Graduation / Academics</option>
                                    <option value="warning">Warning / Alert</option>
                                    <option value="schedule">Calendar / Schedule</option>
                                    <option value="arrow_right">Transfer / Arrow</option>
                                </select>
                                <div id="iconPreview" class="w-10 h-10 bg-white/10 rounded flex items-center justify-center text-white border border-white/20 shrink-0">
                                    </div>
                             </div>
                        </div>
                    </div>

                            <h3 class="text-red-400 font-bold uppercase text-xs tracking-wider">Process Steps</h3>
                            <button type="button" onclick="addVisualStep()" class="bg-green-700 hover:bg-green-600 text-white text-xs px-3 py-1 rounded flex items-center gap-1 transition-colors">
                                <span class="text-lg font-bold">+</span> Add Step
                            </button>
                        </div>
        
                        <div id="stepsContainer" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                            </div>
                    </div>

                            Save & Publish
                        </button>
                    </div>

            </div>

    async function checkIfDbEmpty() {
        const snap = await db.collection('services').get();
        if (snap.empty) {
            document.getElementById('initDbBtn').classList.remove('hidden');
        }
    }

    async function uploadDefaultData() {
        if(!confirm("Initialize database with new generic icons?")) return;
        const batch = db.batch();
        for (const [key, value] of Object.entries(defaultServicesData)) {
            const ref = db.collection('services').doc(key);
            batch.set(ref, value);
        }
        await batch.commit();
        alert("Database Initialized!");
        window.location.reload();
    }

    async function deleteAllServices() {
        // Double Confirmation for safety
        if (!confirm("⚠️ DANGER ZONE: This will delete ALL services from the database.\n\nThis is usually done to reset the system. Are you sure?")) return;
        if (!confirm("‼️ FINAL WARNING: This action cannot be undone. \n\nClick OK to wipe all service data.")) return;

        try {
            const snapshot = await db.collection('services').get();
            
            if (snapshot.empty) {
                alert("Database is already empty.");
                return;
            }

            // Delete in a batch (efficient)
            const batch = db.batch();
            snapshot.docs.forEach(doc => {
                batch.delete(doc.ref);
            });

            await batch.commit();
            
            alert("🗑️ System Reset: All services have been deleted.");
            window.location.reload(); // Reload to show empty state/init button

        } catch (error) {
            console.error("Error clearing database:", error);
            alert("❌ Error: " + error.message);
        }
    }

    async function fetchServices() {
        try {
            const snapshot = await db.collection('services').get();
            
            // 1. Get Containers
            const menuContainer = document.getElementById('serviceMenu');
            const listContainer = document.getElementById('servicesList');

            // 2. CHECK EMPTY STATE
            if (snapshot.empty) {
                // Fix: Clear BOTH containers
                menuContainer.innerHTML = '<div class="text-white p-8 opacity-70">No services found. Admin please initialize database.</div>';
                listContainer.innerHTML = ''; // <--- THIS WAS MISSING
                
                // Show Initialize Button if Admin
                if (isAdminUser) {
                    document.getElementById('initDbBtn').classList.remove('hidden');
                }
                return; 
            }

            // 3. Process Data if not empty
            services = [];
            servicesData = {};
            snapshot.forEach(doc => {
                const data = doc.data();
                services.push({
                    id: doc.id,
                    icon: data.icon || 'default',
                    title: data.title,
                    description: data.subtitle || data.description
                });
                servicesData[doc.id] = data;
            });
            
            renderServiceMenu();
            
        } catch (error) {
            console.error("Error fetching services:", error);
        }
    }

    const detailView = document.getElementById('detailView');
    if (!detailView.classList.contains('hidden') && serviceId) {
        showDetail(serviceId);
    }
}

   async function handleFormSubmit(e) {
        e.preventDefault();
        const serviceId = document.getElementById('buildId').value.trim().toLowerCase();
        const type = document.getElementById('buildType').value;
        
        const serviceData = {
            title: document.getElementById('buildTitle').value,
            subtitle: document.getElementById('buildDesc').value,
            intro: document.getElementById('buildIntro').value, 
            type: type,
            fee: document.getElementById('buildFee').value || "None",
            processing: document.getElementById('buildTime').value || "N/A",
            icon: document.getElementById('buildIcon').value
        };

        const stepElements = document.querySelectorAll('.step-item');
        const rawItems = [];
        
        stepElements.forEach((el, index) => {
            const detailsText = el.querySelector('.step-details-input').value;
            const detailsArray = detailsText.split('\n').filter(line => line.trim() !== '');

            rawItems.push({
                section: el.querySelector('.step-section-input').value.trim() || "General Steps",
                
                // CAPTURE SECTION INTRO HERE
                sectionIntro: el.querySelector('.step-intro-input').value.trim(), 
                
                number: String(index + 1).padStart(2, '0'),
                title: el.querySelector('.step-title-input').value,
                description: el.querySelector('.step-desc-input').value,
                details: detailsArray,
                color: el.querySelector('.step-color-input').value
            });
        });

        if (type === 'pinboard') {
            serviceData.steps = rawItems.map(item => ({
                number: item.number,
                title: item.title,
                description: item.description,
                color: item.color
            }));
        } 
        else {
            // GROUP BY SECTION
            const groupedSections = new Map();
            
            rawItems.forEach(item => {
                if (!groupedSections.has(item.section)) {
                    // Initialize group
                    groupedSections.set(item.section, {
                        steps: [],
                        intro: item.sectionIntro // Take intro from first item found
                    });
                }
                
                // Add step to group
                groupedSections.get(item.section).steps.push({
                    title: item.title,
                    description: item.description,
                    details: item.details
                });
            });

            // Convert Map to Array structure
            serviceData.sections = Array.from(groupedSections, ([name, data]) => ({
                title: name,
                intro: data.intro, // SAVE IT TO FIREBASE
                icon: '📌', 
                steps: data.steps,
                content: data.steps[0].description 
            }));
        }

        try {
            await db.collection('services').doc(serviceId).set(serviceData);
            document.getElementById('buildId').disabled = false;
            alert("✅ Service Published Successfully!");
            closeAdminModal();
            await refreshServiceUI(serviceId);
        } catch (error) {
            alert("❌ Error: " + error.message);
        }
    }

    async function editService(serviceId) {
        const service = servicesData[serviceId];
        if (!service) return;
        
        openAdminModal();
        document.querySelector('#adminModal h2').textContent = "Edit Service";
        
        // Basic Info
        document.getElementById('buildTitle').value = service.title;
        document.getElementById('buildIntro').value = service.intro || '';
        document.getElementById('buildId').value = service.id;
        document.getElementById('buildId').disabled = true;
        document.getElementById('buildDesc').value = service.subtitle;
        document.getElementById('buildType').value = service.type;
        document.getElementById('buildFee').value = service.fee || '';
        document.getElementById('buildTime').value = service.processing || '';
        document.getElementById('buildIcon').value = service.icon || 'default';
        updateIconPreview();
        
        document.getElementById('stepsContainer').innerHTML = '';
        
        // LOAD STEPS INTO FORM
        if (service.type === 'pinboard' && service.steps) {
            service.steps.forEach(step => {
                addVisualStep();
                const lastStep = document.querySelector('.step-item:last-child');
                lastStep.querySelector('.step-title-input').value = step.title;
                lastStep.querySelector('.step-desc-input').value = step.description;
                lastStep.querySelector('.step-color-input').value = step.color || 'blue';
            });
        } 
        else if ((service.type === 'accordion' || service.type === 'list') && service.sections) {
            // Loop through SECTIONS (e.g., First Year, Old Students)
            service.sections.forEach(section => {
                const sectionName = section.title;
                
                // Loop through STEPS inside that section
                // If 'steps' array exists use it, otherwise treat the section itself as 1 step (for List view)
                const stepsToLoad = section.steps || [{ title: section.title, description: section.content }];

                stepsToLoad.forEach(step => {
                    addVisualStep();
                    const lastStep = document.querySelector('.step-item:last-child');
                    
                    // Fill Fields
                    lastStep.querySelector('.step-section-input').value = sectionName; // Auto-fill the section name
                    lastStep.querySelector('.step-title-input').value = step.title;
                    lastStep.querySelector('.step-desc-input').value = step.description || "";
                    
                    // Join array back to text for editing
                    if (step.details && Array.isArray(step.details)) {
                        lastStep.querySelector('.step-details-input').value = step.details.join('\n');
                    }
                });
            });
        }
        
        // Show/Hide fields based on type
        const typeDropdown = document.getElementById('buildType');
        if(typeDropdown.onchange) typeDropdown.onchange(); 

        updateStepVisibility();
    }
    async function deleteService(serviceId) {
    if (!confirm(`Are you sure you want to delete "${servicesData[serviceId]?.title}"?\n\nThis action cannot be undone.`)) {
        return;
    }
    
    try {
        await db.collection('services').doc(serviceId).delete();
        alert("✅ Service deleted successfully!");
        showServiceMenu(); // Return to menu first
        await refreshServiceUI(); // Then refresh without serviceId
    } catch (error) {
        alert("❌ Error deleting service: " + error.message);
    }
}

        // 2. COLOR PICKER (Only show for Pinboard)

        const colorGroups = document.querySelectorAll('.color-group');
        
        colorGroups.forEach(el => isPinboard ? el.classList.remove('hidden') : el.classList.add('hidden'));

   function renderPinboard(service) {
        const columns = 3;
        const rowHeight = 320; 
        const rows = Math.ceil(service.steps.length / columns);
        const totalHeight = Math.max(600, (rows * rowHeight) + 150); // Added height for spacing
        
        const pinboard = document.createElement('div');
        pinboard.className = 'relative w-full mx-auto mt-24'; // Added margin-top
        pinboard.style.height = `${totalHeight}px`;
        pinboard.style.maxWidth = '1200px';

        const paperToPinMap = {
            'pink': 'red', 'peach': 'orange', 'blue': 'blue', 'lavender': 'purple', 'green': 'green'
        };

        const positions = service.steps.map((_, index) => {
            const col = index % columns; 
            const row = Math.floor(index / columns);
            const xCoords = [20, 50, 80]; 
            
            // INCREASED TOP PADDING (from 50 to 80)
            const yPx = 80 + (row * rowHeight) + (col * 15); 
            
            const yPercent = (yPx / totalHeight) * 100;
            return { x: xCoords[col], y: yPercent };
        });

        // ... (Rest of the function remains the same: SVG drawing, Card creation) ...
        // Just copy the rest of your existing renderPinboard logic here
        // ...
        
        // 4. Draw Lines
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'absolute inset-0 w-full h-full pointer-events-none');
        svg.style.zIndex = '0';

        service.steps.forEach((step, index) => {
            if (index < service.steps.length - 1) {
                const fromPos = positions[index];
                const toPos = positions[index + 1];
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', `${fromPos.x + 8}%`);
                line.setAttribute('y1', `${fromPos.y + 5}%`);
                line.setAttribute('x2', `${toPos.x + 8}%`);
                line.setAttribute('y2', `${toPos.y + 5}%`);
                line.setAttribute('class', 'connection-line');
                svg.appendChild(line);
            }
        });
        pinboard.appendChild(svg);

        // 5. Draw Cards
        service.steps.forEach((step, index) => {
            const pos = positions[index];
            const noteContainer = document.createElement('div');
            noteContainer.className = 'sticky-note absolute transition-all duration-300 cursor-pointer group';
            noteContainer.style.left = `${pos.x}%`;
            noteContainer.style.top = `${pos.y}%`;
            
            const rotation = (index % 2 === 0 ? -2 : 2);
            noteContainer.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            noteContainer.style.zIndex = '1';

            const correctPinColor = paperToPinMap[step.color] || 'red';
            const pushpinDiv = document.createElement('div');
            pushpinDiv.className = 'absolute -top-4 left-1/2 -translate-x-1/2 z-10';
            pushpinDiv.innerHTML = createPushpin(correctPinColor);

            const noteCard = document.createElement('div');
            noteCard.className = `${colorMap[step.color] || 'bg-white'} rounded-lg p-6 w-64 shadow-lg group-hover:shadow-2xl transition-shadow duration-300`;
            noteCard.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.15)';
            
            noteCard.innerHTML = `
                <div class="inline-block px-3 py-1 rounded-full bg-white/60 mb-3">
                    <span class="text-slate-600 font-bold">${step.number}</span>
                </div>
                <h3 class="text-slate-900 text-lg mb-2 font-bold">${step.title}</h3>
                <p class="text-slate-600 text-sm leading-relaxed">${step.description}</p>
            `;

            noteContainer.appendChild(pushpinDiv);
            noteContainer.appendChild(noteCard);
            pinboard.appendChild(noteContainer);
        });

        return pinboard;
    }

    function renderAccordion(service) {
        const container = document.createElement('div');
        container.className = 'max-w-4xl mx-auto';

        // GLOBAL INTRO (Red Box) is handled by showDetail, skipped here.

        service.sections.forEach((section) => {

                </svg>
            `;

            const accordionContent = document.createElement('div');
            accordionContent.className = 'accordion-content bg-white/5 border border-white/10 rounded-b-lg overflow-hidden';
        
            let contentHTML = '<div class="p-6 space-y-4">';
            
            // --- NEW: SECTION SPECIFIC INTRO ---
            if (section.intro) {
                contentHTML += `<p class="text-white/80 mb-6 text-sm font-['Montserrat', sans-serif] leading-relaxed">${section.intro}</p>`;
            }

            section.steps.forEach((step, stepIndex) => {
                let detailsListHtml = '';
                if (step.details && step.details.length > 0) {
                    detailsListHtml = `
                        <ul class="list-disc list-inside mt-3 space-y-1 ml-1">
                            ${step.details.map(detail => `
                                <li class="text-white/70 text-sm font-['Montserrat', sans-serif] pl-2 marker:text-white/40">${detail}</li>
                            `).join('')}
                        </ul>
                    `;
                }

                contentHTML += `

                        <div class="flex items-start gap-4">
                            ${service.title.includes('Organization') ? '' : `
                            <div class="step-number flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-[#b91c1c] to-[#7f1d1d] shadow-lg flex items-center justify-center text-white text-sm font-['Outfit', san-serif]">
                                ${stepIndex + 1}
                            </div>`}
                            <div class="flex-1">
                                <h4 class="text-white text-lg mb-2 font-bold font-['Outfit', san-serif]">${step.title}</h4>
                                <p class="text-white text-sm mb-2 font-['Montserrat', sans-serif]">${step.description}</p>
                                ${detailsListHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            contentHTML += '</div>';
            accordionContent.innerHTML = contentHTML;

            // Accordion Toggle
            header.onclick = () => {
                const isActive = accordionContent.classList.contains('active');
                document.querySelectorAll('.accordion-content').forEach(content => {
                    content.classList.remove('active');
                    content.style.maxHeight = null;
                });
                document.querySelectorAll('.accordion-content').forEach((content) => {
                    const h = content.previousElementSibling;
                    h.querySelector('svg').classList.remove('rotate-180');
                });
                if (!isActive) {
                    accordionContent.classList.add('active');
                    accordionContent.style.maxHeight = accordionContent.scrollHeight + "px";
                    header.querySelector('svg').classList.add('rotate-180');
                }
            };

            item.appendChild(header);
            item.appendChild(accordionContent);
            container.appendChild(item);
        });

        return container;
    }

    function renderList(service) {
        const container = document.createElement('div');

            `;
            container.appendChild(card);
        });
        return container;
    }
