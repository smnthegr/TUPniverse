<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUPniverse | Manila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">

    <script src="navbar.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="firebase-config.js"></script>

    <style>
        /* Loading screen styles */
        #loadingScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: modalPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #welcomeModal { z-index: 10000; }
    </style>
</head>
<body class="homepage">

    <div id="loadingScreen">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-700 mx-auto mb-4"></div>
            <p class="text-gray-700 font-medium tracking-wide">Securing Session...</p>
        </div>
    </div>

    <div id="welcomeModal" class="fixed inset-0 flex items-center justify-center" style="display: none;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity"></div>
        
        <div class="relative bg-white/10 backdrop-blur-2xl border border-white/20 p-8 rounded-[2.5rem] shadow-2xl max-w-md w-full text-center mx-4 animate-pop">
            
            <div id="welcomeIconBg" class="mx-auto mb-6 w-24 h-24 rounded-full flex items-center justify-center shadow-lg border border-white/30 overflow-hidden bg-gradient-to-br from-white/20 to-white/5">
                 <svg id="welcomeIconSvg" class="w-12 h-12 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            </div>
            
            <h2 id="welcomeTitle" class="text-3xl font-bold text-white mb-2 tracking-wide drop-shadow-lg"></h2>
            <p id="welcomeMsg" class="text-gray-200 text-lg mb-8 leading-relaxed font-light drop-shadow-md"></p>
            
            <button onclick="closeWelcomeModal()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-red-800 to-red-600 text-white font-bold shadow-xl hover:shadow-red-900/40 hover:scale-[1.02] transition-all duration-300 border border-white/10 uppercase tracking-widest">
                Enter Website
            </button>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none; transition: opacity 0.8s ease;">
        <div class="background-image">
            <img src="tupbg.jpg" alt="TUP Manila Campus" onerror="this.classList.add('hidden')" />
        </div>

        <div class="content">
            <div class="hero-wrapper" id="heroContent" style="opacity: 0;">
                <div class="hero-card">
                    <div class="hero-content">
                        <div class="hero-background">
                            <img src="tupbg.jpg" alt="TUP Manila" onerror="this.classList.add('hidden')">
                            <div class="hero-gradient"></div>
                        </div>

                        <div class="hero-center">
                            <div class="hero-text">
                                <h1 class="font-black">Welcome</h1>
                                <p>Discover our campus, explore our facilities, and connect with our community</p>
                            </div>
                            <button class="explore-button" onclick="window.location.href='campus.html'">Explore Campus</button>
                        </div>

                        <div class="badge-bottom-left">
                            <p class="badge-subtitle text-red-500 font-bold">Technological University</p>
                            <p class="badge-title">of the Philippines</p>
                        </div>

                        <div class="badge-top-right">
                            <p>Manila Campus</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="navbar.js"></script>

    <script>
        // --- 1. Welcome Modal Logic (Modified for Profile Pics) ---
        function closeWelcomeModal() {
            const modal = document.getElementById('welcomeModal');
            modal.style.transition = 'opacity 0.3s ease';
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function triggerWelcome(user) {
            const ADMIN_EMAIL = "samanthaelaine.egar@tup.edu.ph", "tupconnect90@gmail.com";
            const POPUP_SEEN_KEY = 'welcomeShown';

            // Don't show again if seen this session
            if (sessionStorage.getItem(POPUP_SEEN_KEY) === 'true') {
                document.getElementById('welcomeModal').style.display = 'none';
                return;
            }

            const modal = document.getElementById('welcomeModal');
            const title = document.getElementById('welcomeTitle');
            const msg = document.getElementById('welcomeMsg');
            const iconSvg = document.getElementById('welcomeIconSvg');
            const iconBg = document.getElementById('welcomeIconBg');

            if (user.email === ADMIN_EMAIL) {
                // Admin Styling
                title.innerText = "Welcome, Admin Samantha!";
                msg.innerText = "Administrative Access Confirmed.";
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />';
                iconBg.classList.add('shadow-red-500/50', 'from-red-500/20');
            } else {
                // Regular User / Student Styling with Google Profile Pic
                title.innerText = "Hello, " + (user.displayName || "TUP Student") + "!";
                msg.innerText = "Your identity has been verified via 2FA.";
                
                if (user.photoURL) {
                    iconBg.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover rounded-full border-2 border-white/50">`;
                } else {
                    iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />';
                }
            }

            modal.style.display = 'flex';
            sessionStorage.setItem(POPUP_SEEN_KEY, 'true');
        }

        // --- 2. Main Logic with 2FA Gatekeeper ---
        function initializeApp() {
            if (typeof firebase === 'undefined') {
                setTimeout(initializeApp, 100);
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyCBet8G3HOy8_kOSA_KPT9hUZrICsvCpUQ",
                authDomain: "tupniverse-login-2ab22.firebaseapp.com",
                projectId: "tupniverse-login-2ab22",
                storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
                messagingSenderId: "223789253678",
                appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
            };

            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    sessionStorage.removeItem('welcomeShown');
                    window.location.replace('login.html');
                    return;
                }

                try {
                    // 🛡️ 2FA SECURITY CHECK 🛡️
                    const userRef = db.collection('users').doc(user.uid);
                    const userDoc = await userRef.get();

                    // If user hasn't completed OTP, kick them back to login
                    if (!userDoc.exists || !userDoc.data().is2FAVerified) {
                        console.warn("2FA NOT VERIFIED. REDIRECTING...");
                        await auth.signOut();
                        window.location.replace('login.html');
                        return;
                    }

                    // Success: Show Content
                    document.getElementById('loadingScreen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; }, 500);
                    
                    document.getElementById('mainContent').style.display = 'block';
                    triggerWelcome(user);

                    setTimeout(() => { document.getElementById('heroContent').style.opacity = '1'; }, 100);

                } catch (error) {
                    console.error("Database Error:", error);
                    window.location.replace('login.html');
                }
            });
        }

        // --- 3. Run on Load ---
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
