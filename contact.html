<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <script src="navbar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    .error-message {
      color: #ff5555; /* Changed to a standard error red for better visibility */
      font-size: 0.9em;
      margin-top: 5px;
      display: block; 
    }
  </style>
</head>
<body>
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="bg.mp4" type="video/mp4">
      <source src="bg.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>
</div>
  <div class="contact-container">
    <div class="contact-left">
      <h2><span class="script-font">Contact Us</span><br><span class="thankyou">THANK YOU!</span></h2>
      <p>
        We're here to help you with any questions about our university.<br>
        Whether you're a prospective student, current student, parent, or community member, we'd love to hear from you.
      </p>

      <p class="contact-info">
        Phone: 5301.3040/5301.3041 & (02) 301 3001<br>
        Email: registrar@tup.edu.ph/usg@tup.edu.ph
      </p>

      <form action="https://formspree.io/f/xovpgqpl" method="POST" id="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstName" id="firstName" required minlength="2" maxlength="50">
            <span class="error-message" id="firstName-error"></span>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastName" id="lastName" required minlength="2" maxlength="50">
            <span class="error-message" id="lastName-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label>Email (Required)</label>
          <input type="email" name="email" id="email" required>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label>Message (Required)</label>
          <textarea name="message" id="message" required minlength="10" maxlength="1000"></textarea> 
          <span class="error-message" id="message-error"></span>
        </div>

        <span class="error-message" id="global-status"></span>

        <button type="submit" class="send-btn">SEND</button>
      </form>
    </div>

    <div class="contact-right">
      <img src="tup.jpg" alt="TUP Logo">
    </div>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    // Ensure the global status element exists to avoid errors
    const globalStatus = document.getElementById("global-status");


    // --- Helper Functions ---
    function sanitizeInput(str) {
      if (!str) return '';
      return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 2. Error Display Functions
    function displayError(id, message) {
      const errorElement = document.getElementById(id);
      if (errorElement) {
        errorElement.textContent = message;
      }
    }

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
    }

    // --- Core Validation Function ---
    function validateContactForm() {
      let isValid = true;
      clearErrors(); 
      if (globalStatus) globalStatus.textContent = ''; // Clear global status

      const fields = ['firstName', 'lastName', 'email', 'message'];
      let inputs = {};
      let rawInputs = {};
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


      fields.forEach(field => {
        const inputElement = document.getElementById(field);
        rawInputs[field] = inputElement.value; // Get the original input

        const sanitizedValue = sanitizeInput(inputElement.value).trim();
        inputElement.value = sanitizedValue; 
        inputs[field] = sanitizedValue;
      });
      

      // --- CRITICAL SECURITY CHECK (Explicit Rejection) ---
      const checkAttackChars = (value) => value.includes('<') || value.includes('>') || value.includes(';');
      let attackDetected = false;

      if (checkAttackChars(rawInputs.firstName) || checkAttackChars(rawInputs.lastName) || checkAttackChars(rawInputs.email) || checkAttackChars(rawInputs.message)) {
          // If attack code is found, show the security alert and stop
          displayError('global-status', '⚠️ Security Alert: Input contains forbidden characters (<, >, or ;). Please remove them.');
          if (checkAttackChars(rawInputs.message)) {
              displayError('message-error', 'Potential injection attack detected in message.');
          }
          isValid = false;
          attackDetected = true;
      }
      
      if (attackDetected) return false;

      if (inputs.firstName.length < 2 || inputs.firstName.length > 50) { 
          displayError('firstName-error', 'Must be 2-50 characters.');
          isValid = false;
      }
      if (inputs.lastName.length < 2 || inputs.lastName.length > 50) { 
          displayError('lastName-error', 'Must be 2-50 characters.');
          isValid = false;
      }

      if (!emailRegex.test(inputs.email)) {
          displayError('email-error', 'Enter a valid email address.');
          isValid = false;
      }

      if (inputs.message.length < 10 || inputs.message.length > 500) { 
          displayError('message-error', 'Message must be 10-500 characters.');
          isValid = false;
      }

      return isValid;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); 

      if (!validateContactForm()) {
        if (globalStatus.textContent === "") {
            globalStatus.textContent = "Please correct the highlighted errors.";
        }
        return;
      }
      try {
        globalStatus.style.color = 'yellow';
        globalStatus.textContent = "Sending message...";
        
        const data = new FormData(form);
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          globalStatus.style.color = 'lightgreen';
          globalStatus.textContent = "✅ Thank you! Your message has been sent successfully.";
          form.reset();
        } else {
          const responseBody = await response.json();
          globalStatus.style.color = 'red';
          globalStatus.textContent = `⚠️ Submission Failed. Formspree error: ${responseBody.error || 'Unknown issue'}.`;
          console.error("Formspree Submission Failed:", responseBody);
        }

      } catch (error) {
        globalStatus.style.color = 'red';
        globalStatus.textContent = `🚫 Network Error: Could not complete the request.`;
        console.error("Network or Fetch error:", error);
      }
    });
  </script>
</body>
</html>
