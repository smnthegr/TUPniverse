<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUP Manila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <script src="navbar.js"></script>
  
  <style>
    /* Loading screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>
<body class="homepage">
  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mx-auto mb-4"></div>
      <p class="text-gray-600">Loading...</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container" id="mainContent" style="display: none;">
    <div class="background-image">
      <img 
        src="https://cdn.kami.com.ph/images/1120/542505fd70386a12.jpeg?v=1"
        alt="TUP Manila Campus"
        onerror="this.classList.add('hidden')"
      />
    </div>

    <div class="content">
      <div style="position: absolute; top: 20px; right: 20px; z-index: 1000;">
        <button onclick="signOut()" style="background: #dc2626; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;">
          Sign Out
        </button>
      </div>
      <div class="hero-wrapper">
        <div class="hero-card">
          <div class="hero-content">
            <div class="hero-background">
              <img 
                src="https://cdn.kami.com.ph/images/1120/542505fd70386a12.jpeg?v=1"
                alt="TUP Manila Campus"
                onerror="this.classList.add('hidden')">
              <div class="hero-gradient"></div>
            </div>

            <div class="hero-center">
              <div class="hero-text">
                <h1>Welcome</h1>
                <p>Discover our campus, explore our facilities, and connect with our community</p>
              </div>
              <button class="explore-button" onclick="window.location.href='campus.html'">Explore Campus</button>
            </div>

            <div class="badge-bottom-left">
              <p class="badge-subtitle">Technological University</p>
              <p class="badge-title">of the Philippines</p>
            </div>

            <div class="badge-top-right">
              <p>Manila Campus</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCBet8G3HOy8_kOSA_KPT9hUZrICsvCpUQ", // FIXED: Removed the "<" typo
        authDomain: "tupniverse-login-2ab22.firebaseapp.com",
        projectId: "tupniverse-login-2ab22",
        storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
        messagingSenderId: "223789253678",
        appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    // Track if redirect has happened to prevent loop
    let hasRedirected = false;
    
    // Check authentication
    auth.onAuthStateChanged((user) => {
        if (!user || !user.email.endsWith('@tup.edu.ph')) {
            // Not logged in or wrong email - redirect to login ONCE
            if (!hasRedirected) {
                hasRedirected = true;
                window.location.replace('login.html'); // Use replace instead of href
            }
        } else {
            // Logged in with correct email - show the page
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            console.log('User authenticated:', user.email);
        }
    });
    function signOut() {
        if (confirm('Are you sure you want to sign out?')) {
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error('Sign out error:', error);
                alert('Failed to sign out. Please try again.');
            });
        }
    }
  </script>
</body>
</html>
