<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUPniverse Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-logo">
                    <img src="logo.png" alt="TUPniverse Logo">
                </div>
                <h2 class="modal-title">Welcome to TUPniverse</h2>
                <p class="modal-subtitle">Sign in to continue</p>
            </div>

            <div class="info-box">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                <div class="info-text">
                    Please sign in using your <strong>@tup.edu.ph</strong> email address to access the student portal.
                </div>
            </div>

            <button onclick="signInWithGoogle()" class="google-btn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>

            <div id="modalError" class="error-message">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
                <div class="error-text" id="modalErrorText"></div>
            </div>

            <div class="modal-footer">
                <div class="modal-footer-text">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                    </svg>
                    Secure authentication via Google
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content (shown after login) -->
    <div id="mainContent" class="min-h-screen bg-gradient-to-br from-red-50 to-yellow-100 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome Back!</h2>
            <p class="text-gray-600 mb-4">Successfully logged in as:</p>
            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <p id="userName" class="text-lg font-semibold text-gray-800 mb-1"></p>
                <p id="userEmail" class="text-sm text-gray-600"></p>
            </div>
            <button 
                onclick="signOut()"
                class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition-colors font-medium"
            >
                Sign Out
            </button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCBet8G3HOy8_kOSA_KPT9hUZrICsvCpUQ",
            authDomain: "tupniverse-login-2ab22.firebaseapp.com",
            projectId: "tupniverse-login-2ab22",
            storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
            messagingSenderId: "223789253678",
            appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Configure Google Sign-In
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({
            hd: 'tup.edu.ph',
            prompt: 'select_account'
        });

        // Show/Hide Error in Modal
        function showModalError(message) {
            const errorDiv = document.getElementById('modalError');
            const errorText = document.getElementById('modalErrorText');
            errorText.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideModalError() {
            document.getElementById('modalError').classList.remove('active');
        }

        // Save user data to Firestore
        async function saveUserData(user) {
            try {
                const userRef = db.collection('users').doc(user.uid);
                const userDoc = await userRef.get();
                
                if (!userDoc.exists) {
                    await userRef.set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        loginCount: 1
                    });
                    console.log('New user profile created');
                } else {
                    await userRef.update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        loginCount: firebase.firestore.FieldValue.increment(1)
                    });
                    console.log('User login updated');
                }
            } catch (error) {
                console.error('Error saving user data:', error);
            }
        }

        // Sign in with Google
        function signInWithGoogle() {
            hideModalError();
            
            auth.signInWithPopup(provider)
                .then(async (result) => {
                    const user = result.user;
                    const email = user.email;
                    
                    if (email.endsWith('@tup.edu.ph')) {
                        // Save user data to Firestore
                        await saveUserData(user);
                        // Redirect to index page
                        window.location.href = 'index.html';
                    } else {
                        auth.signOut();
                        showModalError('Please use your @tup.edu.ph email address');
                    }
                })
                .catch((error) => {
                    console.error('Login error:', error);
                    if (error.code === 'auth/popup-closed-by-user') {
                        showModalError('Sign-in cancelled. Please try again.');
                    } else if (error.code === 'auth/popup-blocked') {
                        showModalError('Pop-up blocked. Please allow pop-ups and try again.');
                    } else {
                        showModalError('Login failed: ' + error.message);
                    }
                });
        }

        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user && user.email.endsWith('@tup.edu.ph')) {
                // Already logged in, redirect to index
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
