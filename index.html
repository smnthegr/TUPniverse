<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUP Manila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="style.css">

  <script src="navbar.js"></script>
</head>
<body class="homepage">
  <!-- Main Content -->
  <div class="container">
    <div class="background-image">
      <img 
        src="https://cdn.kami.com.ph/images/1120/542505fd70386a12.jpeg?v=1"
        alt="TUP Manila Campus"
        onerror="this.classList.add('hidden')"
      />
    </div>

    <div class="content" id="mainContent">
      <div class="hero-wrapper">
        <div class="hero-card">
          <div class="hero-content">
            <div class="hero-background">
              <img 
                src="https://cdn.kami.com.ph/images/1120/542505fd70386a12.jpeg?v=1"
                alt="TUP Manila Campus"
                onerror="this.classList.add('hidden')"
              />
              <div class="hero-gradient"></div>
            </div>

            <div class="hero-center">
              <div class="hero-text">
                <h1>Welcome</h1>
                <p>Discover our campus, explore our facilities, and connect with our community</p>
              </div>
              <button class="explore-button" onclick="window.location.href='campus.html'">Explore Campus</button>
            </div>

            <div class="badge-bottom-left">
              <p class="badge-subtitle">Technological University</p>
              <p class="badge-title">of the Philippines</p>
            </div>

            <div class="badge-top-right">
              <p>Manila Campus</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCBet<8G3HOy8_kOSA_KPT9hUZrICsvCpUQ",
        authDomain: "tupniverse-login-2ab22.firebaseapp.com",
        projectId: "tupniverse-login-2ab22",
        storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
        messagingSenderId: "223789253678",
        appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    // Check authentication - redirect if not logged in
    auth.onAuthStateChanged((user) => {
        if (!user || !user.email.endsWith('@tup.edu.ph')) {
            // Not logged in or wrong email, redirect to login page
            window.location.href = 'login.html';
        }
        // If logged in with correct email, page will display normally
    });
</script>
</body>
</html>
