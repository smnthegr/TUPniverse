<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUP Manila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">

  <style>
    /* Loading screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7); 
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body class="homepage">
  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mx-auto mb-4"></div>
      <p class="text-gray-600">Loading...</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container" id="mainContent" style="display: none; transition: opacity 0.8s ease;">
    <div class="background-image">
      <img 
        src="tupbg.jpg"
        alt="TUP Manila Campus"
        onerror="this.classList.add('hidden')"
      />
    </div>

    <div class="content">
      <div class="hero-wrapper" id="heroContent" style="opacity: 0;">
        <div class="hero-card">
          <div class="hero-content">
            <div class="hero-background">
              <img 
                src="tupbg.jpg"
                alt="TUP Manila Campus"
                onerror="this.classList.add('hidden')">
              <div class="hero-gradient"></div>
            </div>

            <div class="hero-center">
              <div class="hero-text">
                <h1>Welcome</h1>
                <p>Discover our campus, explore our facilities, and connect with our community</p>
              </div>
              <button class="explore-button" onclick="window.location.href='campus.html'">Explore Campus</button>
            </div>

            <div class="badge-bottom-left">
              <p class="badge-subtitle">Technological University</p>
              <p class="badge-title">of the Philippines</p>
            </div>

            <div class="badge-top-right">
              <p>Manila Campus</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts - Load FIRST before any code that uses Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <!-- Navbar Script - Load AFTER Firebase -->
  <script src="navbar.js"></script>

  <script>
    // Wait for Firebase to be fully loaded
    function initializeApp() {
        console.log('Initializing app...');
        
        // Check if Firebase is available
        if (typeof firebase === 'undefined') {
            console.error('Firebase not loaded yet, retrying...');
            setTimeout(initializeApp, 100);
            return;
        }

        console.log('Firebase loaded successfully');

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCBet8G3HOy8_kOSA_KPT9hUZrICsvCpUQ",
            authDomain: "tupniverse-login-2ab22.firebaseapp.com",
            projectId: "tupniverse-login-2ab22",
            storageBucket: "tupniverse-login-2ab22.firebasestorage.app",
            messagingSenderId: "223789253678",
            appId: "1:223789253678:web:80c828a9c2d695a720cbbf"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log('Firebase initialized');
        }
        const auth = firebase.auth();
        
        // SECURITY: Check authentication - MUST be logged in to see page
        auth.onAuthStateChanged((user) => {
            console.log('Auth state changed:', user ? 'User logged in' : 'No user');
            
            // If NO user is logged in, redirect to login page
            if (!user) {
                console.log('No user detected - redirecting to login');
                window.location.replace('login.html');
                return; // Stop execution
            }

            // If user IS logged in, show the page
            console.log('User authenticated:', user.email);
            
            // Hide loading screen and show content
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            // Animate hero content in
            setTimeout(() => {
                document.getElementById('heroContent').style.opacity = '1';
            }, 100);

            // Update profile info
            setTimeout(() => {
                const navImg = document.getElementById('navProfileImg');
                if (navImg && user.photoURL) navImg.src = user.photoURL;

                const nameTxt = document.getElementById('dropdownName');
                const emailTxt = document.getElementById('dropdownEmail');
                
                if (nameTxt) nameTxt.textContent = user.displayName || "TUP Student";
                if (emailTxt) emailTxt.textContent = user.email;
            }, 500);
        });
    }

    // Start initialization when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
        initializeApp();
    }
  </script>
</body>
</html>
